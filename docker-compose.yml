services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      N8N_URL: ${N8N_URL}
      TRAVEL_N8N_URL: ${TRAVEL_N8N_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: travel-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend